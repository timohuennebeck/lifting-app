# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
# Restart the PowerSync service after editing this file.
config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM profiles WHERE user_id = auth.user_id()
      - SELECT * FROM plans WHERE user_id = auth.user_id()
      - SELECT * FROM routines WHERE user_id = auth.user_id()
      - SELECT * FROM routine_exercises WHERE user_id = auth.user_id()
      - SELECT * FROM routine_sets WHERE user_id = auth.user_id()
      - SELECT * FROM workout_entries WHERE user_id = auth.user_id()
      - SELECT * FROM workout_entries_exercises WHERE user_id = auth.user_id()
      - SELECT * FROM workout_entries_sets WHERE user_id = auth.user_id()
      - SELECT * FROM custom_exercises WHERE user_id = auth.user_id()
      - SELECT * FROM weight_entries WHERE user_id = auth.user_id()
      - SELECT * FROM meal_entries WHERE user_id = auth.user_id()
      - SELECT * FROM progress_checks WHERE user_id = auth.user_id()
      - SELECT * FROM progress_check_photos WHERE user_id = auth.user_id()
      - SELECT * FROM tickets WHERE user_id = auth.user_id()
      - SELECT * FROM ticket_messages WHERE user_id = auth.user_id()
      - SELECT * FROM ticket_events WHERE user_id = auth.user_id()
      - SELECT * FROM legal_acceptances WHERE profile_id = auth.user_id()
