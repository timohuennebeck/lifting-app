# Local PowerSync service wired to the local Supabase stack (`npm run supabase:start` first).
services:
  mongo:
    image: mongo:7.0
    command: --replSet rs0 --bind_ip_all --quiet
    restart: unless-stopped
    volumes:
      - mongo_storage:/data/db

  mongo-rs-init:
    image: mongo:7.0
    depends_on: [mongo]
    restart: on-failure
    entrypoint:
      - bash
      - -c
      - 'mongosh --host mongo:27017 --eval ''try{rs.status().ok && quit(0)} catch {} rs.initiate({_id: "rs0", version: 1, members: [{ _id: 0, host : "mongo:27017" }]})'''

  powersync:
    image: journeyapps/powersync-service:latest
    command: ['start', '-r', 'unified']
    restart: unless-stopped
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgres://postgres:postgres@supabase_db_forge:5432/postgres
      PS_MONGO_URI: mongodb://mongo:27017/powersync
      PS_PORT: 8080
    volumes:
      - ./:/config
    ports:
      - 8080:8080
    networks: [default, supabase_network_forge]

volumes:
  mongo_storage:

networks:
  supabase_network_forge:
    external: true
